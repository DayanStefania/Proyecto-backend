<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hotel para Mascotas{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f8fb;
            color: #333;
        }

        header {
            background-color: #2f6f6d;
            color: white;
            padding: 20px;
        }

        nav {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2f6f6d;
        }

        form p {
            margin-bottom: 18px;
        }

        input,
        textarea,
        select {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button,
        .boton {
            display: inline-block;
            background-color: #2f6f6d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        .boton:hover {
            background-color: #245957;
        }

        .boton-eliminar {
            background-color: #d9534f;
        }

        .reserva {
            background-color: #f8f8ff;
            border: 1px solid #ddd;
            padding: 18px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .acciones {
            margin-top: 12px;
        }

        .acciones a {
            margin-right: 10px;
        }

        .errorlist {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <h2>🐾 Hotel para Mascotas</h2>

        <div>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_reservas' %}">Reservas</a>
        </div>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
